<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#000000;text-decoration:none}a:hover{color:#6D6D72}
.n{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F2F2F7;color:#000000;position:relative;overflow:hidden">

  <div style="position:absolute;left:16px;top:64px;width:44px;height:44px;border-radius:999px;background:#E5E5EA;display:flex;align-items:center;justify-content:center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </div>

  <div style="position:absolute;left:16px;top:128px;width:358px">
    <div style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em">New event</div>
    <div style="margin-top:8px;font-size:16px;line-height:24px;color:#6D6D72">One dinner, one bill, one settlement.</div>
  </div>

  <div style="position:absolute;left:16px;top:236px;width:358px;display:flex;flex-direction:column;gap:24px">

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:#6D6D72;text-transform:uppercase">What was it</div>
      <div style="height:48px;border-radius:12px;background:#FFFFFF;border:1.5px solid #000000;display:flex;align-items:center;padding:0 14px;font-size:16px;font-weight:400">Dinner at Rosati's<span style="display:inline-block;width:1.5px;height:20px;background:#000000;margin-left:2px"></span></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:#6D6D72;text-transform:uppercase">Where</div>
      <div style="height:48px;border-radius:12px;background:#E5E5EA;display:flex;align-items:center;padding:0 14px;font-size:16px;color:#AEAEB2">Rosati's, Logan Square</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:#6D6D72;text-transform:uppercase">Details</div>
      <div style="background:#FFFFFF;border:0.5px solid #C6C6C8;border-radius:16px;overflow:hidden">
        <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
          <div style="font-size:16px;font-weight:600">When</div>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="n" style="font-size:15px;font-weight:500;color:#6D6D72">Fri, Aug 22</div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
        <div style="height:0.5px;background:#C6C6C8;margin-left:16px"></div>
        <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
          <div style="font-size:16px;font-weight:600">Currency</div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="font-size:15px;font-weight:500;color:#6D6D72">USD</div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
        <div style="height:0.5px;background:#C6C6C8;margin-left:16px"></div>
        <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
          <div>
            <div style="font-size:16px;font-weight:600">Who paid</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:999px;background:#000000;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">P</div>
            <div style="font-size:15px;font-weight:500;color:#6D6D72">You</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="position:absolute;left:16px;top:592px;width:358px;padding:16px;border-radius:16px;background:#F4FBD8;display:flex;gap:12px;align-items:flex-start">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M12 4l1.7 4.6L18.5 10l-4.8 1.4L12 16l-1.7-4.6L5.5 10l4.8-1.4z"/></svg>
    <div style="font-size:13px;line-height:18px;color:#6D6D72">You're the only one with an account. Everyone else is just a name on this bill.</div>
  </div>

  <div style="position:absolute;left:16px;bottom:50px;width:358px;height:56px;border-radius:999px;background:#C9F31D;color:#000000;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600">Add people
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
  </div>

</div>
</x-dc>
</body>
</html>
